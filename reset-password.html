<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Room Ready Supply</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="top-bar">
    <p>Rooms ready. Supplies handled. Reorder made easy.</p>
    <div class="top-contact">
      <span>☎ (252) 227-0073</span>
      <span>✉ hello@roomreadysupply.com</span>
    </div>
  </div>

  <header class="navbar">
    <a href="/" class="logo">
      <img src="RR logo.png" alt="Room Ready Supply Logo" />
    </a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/catalog">Catalog</a>
    </nav>
    <!-- Mobile Nav Toggle -->
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <section class="login-section">
    <div class="login-container">

      <div class="login-form">
        <h1>Set New Password</h1>
        <p class="auth-subtitle">Enter and confirm your new password below.</p>

        <div id="resetError"   class="auth-error"   style="display:none"></div>
        <div id="resetSuccess" class="auth-success" style="display:none">Password updated! Redirecting to sign in…</div>

        <form id="resetPasswordForm">
          <div class="input-group" style="margin-bottom:14px">
            <img src="eye-line.svg" alt="">
            <input type="password" id="newPassword" placeholder="New password" required>
          </div>
          <div class="input-group" style="margin-bottom:20px">
            <img src="eye-line.svg" alt="">
            <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
          </div>
          <button type="submit" class="signin-btn">Update Password</button>
        </form>

        <p class="auth-switch"><a href="/login">← Back to Sign In</a></p>
      </div>

      <div class="login-banner">
        <img src="75902.jpg" alt="Room Ready Supply" style="width:100%;height:100%;object-fit:cover;">
      </div>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
