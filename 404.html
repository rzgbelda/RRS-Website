<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Room Ready Supply</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    .nav { background: #0B1F38; padding: 0 32px; height: 64px; display: flex; align-items: center; }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { height: 36px; }
    .nav-logo span { color: #fff; font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
    .body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
    .card { background: #fff; border-radius: 20px; border: 1.5px solid #e2e8f0; padding: 56px 48px; text-align: center; max-width: 480px; width: 100%; }
    .code { font-size: 80px; font-weight: 900; color: #e2e8f0; letter-spacing: -4px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; color: #0B1F38; margin-bottom: 12px; }
    p { font-size: 15px; color: #64748b; line-height: 1.6; margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: #ED7226; color: #fff; border: none; border-radius: 10px; padding: 13px 24px; font-size: 14px; font-weight: 800; text-decoration: none; display: inline-block; }
    .btn-secondary { background: transparent; color: #0B1F38; border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 700; text-decoration: none; display: inline-block; }
    .btn-primary:hover { background: #d4611a; }
    .btn-secondary:hover { border-color: #0B1F38; }
  </style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/images/RRS_Logo.png" alt="Room Ready Supply" onerror="this.style.display='none'">
    <span>Room Ready Supply</span>
  </a>
</nav>
<div class="body">
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Back to Home</a>
      <a href="/catalog" class="btn-secondary">Browse Catalog</a>
    </div>
  </div>
</div>
</body>
</html>
